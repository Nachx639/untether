    <!-- Theme and colours before the first paint. Inline, not /theme-init.js: an external
         script in <head> holds the first paint until it arrives, and on a cold start of the
         home-screen app every file of ours comes from the service worker, which has to boot
         first (3 s of white on the iPhone SE, 2026-10-04). A copy of assets/theme-init.js
         (logs.html still loads that file); the CSP allows it by hash (server/utils/csp.ts),
         and tests check the copy, the hash and the file agree. -->
    <script>
// Theme and colour before the first paint, run synchronously from <head>. logs.html loads
// this file; index.html carries an inline copy so its first paint waits on nothing (allowed
// by its hash in server/utils/csp.ts; tests check the copy and the hash).
(() => {
  // The interface style (utils/look.ts): what the first paint needs is in one stored entry
  // (this device's choice; without one, the server's default, written into index.html)
  let look = null;
  try {
    const meta = document.querySelector('meta[name="ut-server-look"]');
    const own = localStorage.getItem('untether-look') || !meta;
    const raw = own ? localStorage.getItem('untether-look-boot') : meta.getAttribute('content');
    const boot = JSON.parse(raw || 'null');
    if (boot && /^[a-z0-9-]+$/.test(boot.id)) look = boot;
  } catch (_) {}
  if (look) document.documentElement.setAttribute('data-look', look.id);

  // Load saved theme preference or use system preference
  const saved = localStorage.getItem('untether-theme');
  const theme = saved || 'system';

  // Apply theme immediately; a style that is only light or only dark decides
  const effectiveTheme =
    look && (look.force === 'light' || look.force === 'dark')
      ? look.force
      : theme === 'system'
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        : theme;
  document.documentElement.setAttribute('data-theme', effectiveTheme);

  // Set initial background color: the style's, or the app's
  var lookBg = look && look.bg && look.bg[effectiveTheme];
  var initialBg = effectiveTheme === 'dark' ? '#131211' : '#FAF9F7';
  if (/^#[0-9a-fA-F]{6}$/.test(lookBg || '')) initialBg = lookBg;
  document.documentElement.style.backgroundColor = initialBg;
  // Browser chrome matches from the first frame instead of flashing the wrong shade
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', initialBg);

  // Color theme (utils/accent-themes.ts) before first paint
  try {
    const accent = localStorage.getItem('untether-accent');
    if (accent) document.documentElement.setAttribute('data-accent', accent);
  } catch (_) {}

  // "Chat width" (utils/chat-width.ts) before first paint; no attribute is the default (full)
  try {
    const chatWidth = localStorage.getItem('ut-chat-width');
    if (chatWidth === 'comfortable') {
      document.documentElement.setAttribute('data-chat-width', chatWidth);
    }
  } catch (_) {}

  // "Use the system text size" (utils/system-text-size.ts) before first paint: the same
  // probe and clamp (16-22 px root, chrome at most 1.15x); the test checks they agree.
  try {
    if (localStorage.getItem('ut-system-text-size') === 'on') {
      const root = document.documentElement;
      const probe = document.createElement('span');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText =
        'font: -apple-system-body; position: absolute; visibility: hidden; pointer-events: none;';
      root.appendChild(probe);
      const body = Number.parseFloat(getComputedStyle(probe).fontSize);
      probe.remove();
      const size = Number.isFinite(body) && body > 0 ? Math.min(Math.max(body, 16), 22) : 16;
      root.setAttribute('data-text-size', 'system');
      root.style.setProperty('--ut-root-text', `${size}px`);
      root.style.setProperty('--ut-chrome-scale', String(Math.min(size / 16, 1.15)));
    }
  } catch (_) {}
})();
</script>

    <!-- Styles, without holding the first paint: as media="print" it is fetched but never
         blocks rendering, and the script below applies it once it has loaded. Until then the
         app stays hidden behind the boot screen (no flash of an unstyled app). -->
    <link rel="preload" href="/bundle/styles.css" as="style" />
    <link id="ut-styles" href="/bundle/styles.css" rel="stylesheet" media="print" />
    <script>
(() => {
  const root = document.documentElement;
  const link = document.getElementById('ut-styles');
  // The app shows when styles.css and the chosen style's sheet are in. A failed load shows it
  // anyway, rather than a boot screen that never goes away.
  let waiting = 1;
  const settled = () => {
    if (--waiting === 0) root.setAttribute('data-ut-styles', '');
  };
  const look = root.getAttribute('data-look');
  if (look) {
    waiting++;
    // Added here, after styles.css in the document: a style wins ties with the app's own tokens.
    const sheet = document.createElement('link');
    sheet.id = 'ut-look-' + look;
    sheet.rel = 'stylesheet';
    // Named by its content (utils/look.ts lookHref): a changed sheet is another URL, never the
    // service worker's copy of the old one.
    let version = '';
    try {
      const versions = JSON.parse(
        document.querySelector('meta[name="ut-look-versions"]').getAttribute('content') || '{}'
      );
      if (/^[0-9a-f]{16}$/.test(versions[look])) version = '?v=' + versions[look];
    } catch (_) {}
    sheet.href = '/looks/' + look + '.css' + version;
    let lookDone = false;
    const lookSettled = () => {
      if (lookDone) return;
      lookDone = true;
      sheet.dataset.settled = '1';
      settled();
    };
    sheet.addEventListener('load', lookSettled, { once: true });
    sheet.addEventListener('error', lookSettled, { once: true });
    setTimeout(lookSettled, 3000);
    document.head.appendChild(sheet);
  }
  const apply = () => {
    link.media = 'all';
    settled();
  };
  if (link.sheet) apply();
  else {
    link.addEventListener('load', apply, { once: true });
    link.addEventListener('error', apply, { once: true });
  }
})();
</script>
    <!-- The app's code, fetched and compiled while the head is still being parsed (its
         <script> is at the end of <body>; docs/cold-start.md) -->
    <link rel="modulepreload" href="/bundle/client-bundle.js" />
    <!-- The terminal's font (core part, no icons: styles.css), fetched alongside the CSS rather
         than after it; the terminal waits for it before measuring its cells (terminal-fonts.ts) -->
    <link rel="preload" href="/fonts/hack-core-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hack-core-bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Mobile viewport and address bar handling -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh; /* Use dynamic viewport height for better keyboard handling */
        /* Home-screen app on iPhone: innerHeight (and 100dvh) come up short by the status bar,
           so the script below sets --app-height to the screen height; this rule used to win
           over it and left a blank band under the session list (2026-10-03, 62 pt on a Pro
           Max). Everywhere else --app-height is 100dvh (styles.css). */
        height: var(--app-height, 100dvh);
        overscroll-behavior-y: none; /* Prevent pull-to-refresh */
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent pull-to-refresh only on specific elements */
      body {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The callout is inherited: in text fields it took away iOS's Paste on a long press
         (the composer, 2026-10-10). Fields keep it; the terminal's hidden catcher sets its own. */
      input,
      textarea,
      [contenteditable='true'] {
        -webkit-touch-callout: default;
      }

      /* Enable pinch-zoom on terminal components while preventing pan */
      ut-terminal {
        touch-action: pinch-zoom;
      }

      /* Ensure app takes full viewport */
      untether-app {
        display: block;
        width: 100%;
        min-height: 100%;
      }
      /* The first frame's colours with nothing loaded: the inline theme script sets the same
         on <html>; this covers storage being blocked. */
      html {
        background-color: #131211;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) {
          background-color: #FAF9F7;
        }
      }
      html[data-theme='light'] {
        background-color: #FAF9F7;
      }
      /* Hidden (still laid out) until styles.css applies: see the script after its <link>. */
      html:not([data-ut-styles]) untether-app {
        visibility: hidden;
      }
      /* Until the app's script runs and its styles apply (seconds on a phone or a slow link)
         the page was blank and looked broken: the icon and a spinner. Everything it needs is in
         this page, so it paints as soon as the HTML arrives; it used to fade in 0.4 s after a
         first paint that waited for styles.css and theme-init.js (2026-10-04). Gone once
         <untether-app> is defined and styled. */
      #ut-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: none;
      }
      html[data-ut-styles] untether-app:defined ~ #ut-boot {
        display: none;
      }
      #ut-boot img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      #ut-boot .ut-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(127, 127, 127, 0.25);
        border-top-color: rgba(127, 127, 127, 0.85);
        animation: ut-boot-spin 0.8s linear infinite;
      }
      @keyframes ut-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="m-0 p-0 bg-bg text-text">
    <untether-app></untether-app>
    <!-- Opaque band under the status bar in the home-screen app, so iOS 26+ doesn't blur the
         header (styles.css, .ut-status-bar) -->
    <div class="ut-status-bar" aria-hidden="true"></div>
    <div id="ut-boot" aria-hidden="true">
      <!-- 64 pt: the 192 px icon is sharp at 3x and 43 KB, the 512 px one 195 KB -->
      <img src="/icon-192.png" alt="" />
      <div class="ut-boot-spinner"></div>
    </div>

    <!-- Mobile viewport height fix. Deferred: it still runs before the bundle (scripts that
         wait for the page run in order) but no longer holds the parser on the service worker. -->
    <script defer src="/viewport-init.js"></script>

    <script type="module" src="/bundle/client-bundle.js"></script>
  </body>
</html>
