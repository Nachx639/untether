[package]
name = "untether-fwd"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = { version = "0.4.4", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 2026-10-12: Xcode 27 strip corrupts proc-macro dylibs built with chained fixups
# (MACOSX_DEPLOYMENT_TARGET>=12, exported by mac/scripts/build-web-frontend.sh and Xcode);
# dyld refuses them with "mis-aligned LINKEDIT string pool" and the build dies loading
# serde_derive. Host-only artifacts (proc-macros, build scripts) are never shipped, so keep
# them unstripped. Do NOT unset MACOSX_DEPLOYMENT_TARGET instead: the shipped binary would
# silently drop to minos 11.0. Guarded by web/src/test/unit/ut-fwd-cargo-profile.test.ts.
[profile.release.build-override]
strip = false
